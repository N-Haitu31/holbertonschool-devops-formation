services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=toto123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  
  web:
    image: nginx:alpine
    ports:
      - "8090:80"