services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=toto123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8091:80"
    depends_on:
      - api