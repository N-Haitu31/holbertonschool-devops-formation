services:
  db:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=toto123
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7-alpine

  web:
    image: nginx:alpine
    ports:
      - "8092:80"

  api:
    image: nginx:alpine
    ports:
      - "8093:80"
    depends_on:
      - db
